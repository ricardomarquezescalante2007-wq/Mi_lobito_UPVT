<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Mi Lobito UPVT HOLAAA MFG</title>

  <base href="/" />

  <!-- Metadatos para dispositivos móviles y PWA en Ionic -->
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <meta name="theme-color" content="#3880ff" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Favicon de la aplicación -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/favicon.png" />

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Estilos de carga inicial mientras Angular compila -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #ffffff;
      }
    }

    .angular-app-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(56, 128, 255, 0.2);
      border-top: 5px solid #3880ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Componente raíz donde Angular e Ionic inyectan toda la app -->
  <app-root>
    <div class="angular-app-loading">
      <div class="spinner"></div>
      <p style="margin-top: 16px; font-weight: 500; color: #666;">Cargando Mi Lobito UPVT...</p>
    </div>
  </app-root>

  <!-- Scripts de Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
